name: Stage npm package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact existing Git tag to stage (for example, v1.0.1)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  stage:
    name: Verify and stage on npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node --input-type=module -e "
            import packageJson from './package.json' with { type: 'json' };
            const expected = 'v' + packageJson.version;
            if (process.env.RELEASE_TAG !== expected) {
              throw new Error('release tag ' + process.env.RELEASE_TAG + ' must equal ' + expected);
            }
          "
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$(git rev-parse HEAD)" = "$tag_commit"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run release checks
        run: pnpm release:check
      - name: Choose npm distribution tag
        id: dist
        run: |
          node --input-type=module -e "
            import { appendFileSync } from 'node:fs';
            import packageJson from './package.json' with { type: 'json' };
            const tag = packageJson.version.includes('-') ? 'next' : 'latest';
            appendFileSync(process.env.GITHUB_OUTPUT, 'tag=' + tag + '\n');
          "
      - name: Stage package for maintainer approval
        run: npm stage publish --tag "${{ steps.dist.outputs.tag }}"
